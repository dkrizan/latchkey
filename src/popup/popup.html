<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AutoLogin Rules</title>
  <link rel="stylesheet" href="../shared/ui.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="row head">
    <img src="../icons/icon-32.png" alt="" width="20" height="20" />
    <strong>AutoLogin Rules</strong>
    <div class="spacer"></div>
    <label class="switch" title="Enable or pause all rules">
      <input type="checkbox" id="global-enabled" aria-label="Enable all rules" /><span></span>
    </label>
  </header>

  <section class="site">
    <div class="site-host" id="site-host">…</div>
    <div class="site-title muted" id="site-title"></div>
  </section>

  <section id="content" class="content"></section>

  <footer class="row foot">
    <button class="btn ghost sm" id="open-options">Manage rules</button>
    <div class="spacer"></div>
    <button class="btn sm" id="add-for-site">+ Rule for this site</button>
  </footer>

  <script src="../lib/core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
